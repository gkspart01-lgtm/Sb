# Portainer + Traefik auf dem VPS (212.227.139.254)
#
# Deploy:  docker compose -f /docker-vol/portainer-traefik-stack.yml up -d
# Prüfen:  docker ps --format '{{.Names}}\t{{.Status}}' ; docker logs --tail=20 traefik
#
# Achtung: Portainer steckt selbst in diesem Stack -> kein Portainer-Stack,
# Henne-Ei-Problem. Änderungen laufen über die CLI, nicht über die Portainer-UI.
#
# Änderungen gegenüber der alten Fassung:
#   + restart: unless-stopped bei traefik und portainer (vorher fehlte es ->
#     nach einem Reboot/Daemon-Neustart blieben beide unten, Rest kam wieder hoch)
#   + --log.level=INFO (Default ist ERROR, deshalb war "docker logs traefik" leer)
#   + HTTP->HTTPS-Redirect am EntryPoint (v3-Weg, gilt für alle Hosts auf :80)
#   - Router http-catchall + Middleware redirect-to-https entfernt:
#     "hostregexp({host:.+})" ist Traefik-v2-Syntax. In v3 ist das ein gültiger
#     Regex, der auf den Text "{host:...}" matcht - also nichts -> 404 auf http://
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    environment:
      - "IONOS_API_KEY_FILE=/run/secrets/ionos_api_key"
    command:
      # Dashboard
      - "--api.dashboard=true"

      # Logs (Default: nur ERROR nach stdout)
      - "--log.level=INFO"

      # Docker Provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # Dynamische Config (Basic Auth etc.)
      - "--providers.file.directory=/config"

      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # HTTP -> HTTPS zentral am EntryPoint (Traefik v3)
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"

      # Let's Encrypt (DNS-01, Wildcard-fähig)
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=ionos"
      - "--certificatesresolvers.letsencrypt.acme.email=f.thomale@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/docker-vol/traefik/acme.json:/acme.json"
      - "/docker-vol/traefik/config:/config"
    networks:
      - traefik-net
    secrets:
      - ionos_api_key
    labels:
      - "traefik.enable=true"

      # Dashboard
      - "traefik.http.routers.dashboard.rule=Host(traefik.mehrwert.icu)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=auth-traefik@file"

  portainer:
    image: portainer/portainer-ce:sts
    container_name: portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/docker-vol/portainer:/data"
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"

      # Router (nur HTTPS)
      - "traefik.http.routers.portainer.rule=Host(portainer.mehrwert.icu)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portainer.middlewares=auth-portainer@file"

      # Wichtig: Portainer läuft intern auf 9000
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

networks:
  traefik-net:
    name: traefik-net
    driver: bridge

secrets:
  ionos_api_key:
    file: /docker-vol/traefik/secrets/ionos_api_key
